# pnpm settings (pnpm 12 reads these here, not from package.json).
# Build scripts that npm used to run implicitly; pnpm blocks them unless allowed.
allowBuilds:
  core-js: false
  core-js-pure: false
# npm hoisted every @types/* package to the top level; the TypeScript setup relies on that.
publicHoistPattern:
  - '@types/*'
