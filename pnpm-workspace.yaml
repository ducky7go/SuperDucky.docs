# pnpm settings (pnpm 12 reads these here, not from package.json).
# Dependency lifecycle scripts run only for approved packages.
allowBuilds:
  esbuild: true
  sharp: true

# pnpm 12 rejects packages younger than its default minimumReleaseAge (1 day).
# Exempt the first-party scope, which is published and consumed the same day.
minimumReleaseAgeExclude:
  - "@hagicode/*"
